description: Karl M.H. Lai received the BEng(EE) degree and MSc degree in HKU in 2019 and 2022. In 2019, he joined CLP Power Hong Kong as a protection engineer specializing in tieline, generator and IBR protection and control. He has a particular interest in advanced control, detection, filtering and estimation in IBR and HVDC systems.
